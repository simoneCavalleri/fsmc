name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format Check (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM Tools & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy python3

      - name: Check Formatting with clang-format
        run: |
          find include tools tests examples benchmarks -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

      - name: Configure CMake for Clang-Tidy & SSOT Checks
        run: |
          cmake -B build -S . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DFSMC_ENABLE_BENCHMARKS=ON

      - name: Verify Standalone Runtime Synchronization (SSOT)
        run: |
          cmake --build build --target check_standalone_runtime

      - name: Run Clang-Tidy
        run: |
          clang-tidy -p build tools/fsmc/main.cpp tools/fsm-opt/main.cpp tests/core/test_deferred.cpp tests/backend/emitters/test_format_export.cpp tests/core/test_timed_transitions.cpp

  docs-catalog-sync:
    name: Test Catalog Sync Check
    runs-on: ubuntu-latest
    # Runs in parallel with lint-and-format and build-and-test.
    # Does NOT block merges: catalog drift is surfaced as a warning, not a gate.
    # Developers should run: python3 scripts/generate_test_catalog.py
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        run: sudo apt-get update && sudo apt-get install -y python3

      - name: Configure CMake for check_test_catalog target
        run: cmake -B build -S . -DFSMC_ENABLE_TESTING=ON -DFSMC_ENABLE_BENCHMARKS=OFF

      - name: Verify Test Suite Catalog is Synchronized
        run: |
          cmake --build build --target check_test_catalog

  build-and-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GCC 13
          - name: Linux (GCC 13)
            os: ubuntu-latest
            cc: gcc-13
            cxx: g++-13
            pkg: g++-13

          # Linux Clang 18
          - name: Linux (Clang 18)
            os: ubuntu-latest
            cc: clang-18
            cxx: clang++-18
            pkg: clang-18

          # macOS AppleClang
          - name: macOS (AppleClang)
            os: macos-latest
            cc: clang
            cxx: clang++

          # Windows MSVC 2022
          - name: Windows (MSVC 2022)
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.pkg }}

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows MSVC)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -S . -A x64 -T host=x64

      - name: Build fsmc, Generated Tests & Showcases
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --build build --config Release --parallel 2
          else
            cmake --build build --config Release --parallel
          fi

      - name: Run Test Suite via CTest
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Verify Visual Diagram Renderings (All Formats)
        if: runner.os == 'Linux' && matrix.name == 'Linux (GCC 13)'
        run: |
          sudo apt-get install -y graphviz libxml2-utils default-jre
          mkdir -p build/tools
          test -f build/tools/plantuml.jar || curl -sL -o build/tools/plantuml.jar "https://github.com/plantuml/plantuml/releases/download/v1.2024.6/plantuml-1.2024.6.jar"
          ./scripts/verify_diagram_renderings.py
