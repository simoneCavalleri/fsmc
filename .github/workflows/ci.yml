name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Format Check (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM Tools & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy python3

      - name: Check Formatting with clang-format
        run: |
          find src include tools tests examples benchmarks -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

      - name: Configure CMake for Clang-Tidy & SSOT Checks
        run: |
          cmake -B build -S . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DFSMC_ENABLE_BENCHMARKS=ON

      - name: Verify Standalone Runtime Synchronization (SSOT)
        run: |
          cmake --build build --target check_standalone_runtime

      - name: Run Clang-Tidy
        run: |
          find src tools -name '*.cpp' | sort | xargs -P2 -n4 clang-tidy -p build
          clang-tidy -p build tests/backend/cpp/runtime/test_deferred.cpp tests/backend/diagram/test_diagram_export.cpp tests/backend/cpp/runtime/test_timed_transitions.cpp

  docs-quality-gate:
    name: Docs Quality Gate (MkDocs Strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs & Plugins
        run: |
          pip install mkdocs mkdocs-material pymdown-extensions pyyaml

      - name: Verify Documentation Freshness & Veracity Gate
        run: |
          python3 scripts/verify_docs.py

      - name: Build Docs with --strict Quality Gate
        run: |
          mkdocs build --strict

      - name: Generate Docs Summary
        run: |
          echo "### 📚 Documentation Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "✅ MkDocs site built cleanly with \`--strict\` (0 broken links, 0 warnings)." >> $GITHUB_STEP_SUMMARY

  build-and-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GCC 13
          - name: Linux (GCC 13)
            os: ubuntu-latest
            cc: gcc-13
            cxx: g++-13
            pkg: g++-13
            werror: ON

          # Linux Clang 18
          - name: Linux (Clang 18)
            os: ubuntu-latest
            cc: clang-18
            cxx: clang++-18
            pkg: clang-18
            werror: ON

          # macOS AppleClang
          - name: macOS (AppleClang)
            os: macos-latest
            cc: clang
            cxx: clang++
            werror: OFF

          # Windows MSVC 2022
          - name: Windows (MSVC 2022)
            os: windows-latest
            werror: OFF

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ccache (Compiler Acceleration)
        uses: hendrikmuhs/ccache-action@v1.2
        if: runner.os != 'Windows'
        with:
          key: ${{ runner.os }}-${{ matrix.name }}

      - name: Install Linux Compiler & Tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.pkg }}

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFSMC_WARNINGS_AS_ERRORS=${{ matrix.werror }}

      - name: Configure CMake (Windows MSVC)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -S . -A x64 -T host=x64

      - name: Build fsmc, Generated Tests & Showcases
        shell: bash
        run: |
          cmake --build build --config Release --parallel 2

      - name: Run Test Suite via CTest
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Verify Visual Diagram Renderings (All Formats)
        if: runner.os == 'Linux' && matrix.name == 'Linux (GCC 13)'
        run: |
          sudo apt-get install -y graphviz libxml2-utils default-jre
          mkdir -p build/tools
          test -f build/tools/plantuml.jar || curl -sL -o build/tools/plantuml.jar "https://github.com/plantuml/plantuml/releases/download/v1.2024.6/plantuml-1.2024.6.jar"
          ./scripts/verify_diagram_renderings.py

      - name: Verify Formal SMV Export with nuXmv Matrix
        if: runner.os == 'Linux' && matrix.name == 'Linux (GCC 13)'
        run: |
          mkdir -p /tmp/nuxmv
          curl -sSL -o /tmp/nuxmv/nuXmv.tar.gz https://nuxmv.fbk.eu/theme/download.php?file=nuXmv-2.0.0-linux64.tar.gz
          tar -xzf /tmp/nuxmv/nuXmv.tar.gz -C /tmp/nuxmv
          python3 scripts/test_nuxmv_matrix.py

      - name: Generate CI Summary Report
        if: runner.os == 'Linux' && matrix.name == 'Linux (GCC 13)'
        run: |
          echo "### 🚀 CI Pipeline Results (${{ matrix.name }})" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **CTest Test Suite** | ✅ Passed | All CTest targets executed cleanly |" >> $GITHUB_STEP_SUMMARY
          echo "| **nuXmv Formal Verification** | ✅ Verified | Formal SMV matrix proven sound |" >> $GITHUB_STEP_SUMMARY
          echo "| **Visual Diagram Transpilation** | ✅ Validated | 35/35 validations across all formats |" >> $GITHUB_STEP_SUMMARY

  sanitizers-asan-ubsan:
    name: Memory & UB Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-sanitizers

      - name: Configure CMake with Sanitizers (Debug)
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFSMC_ENABLE_SANITIZERS=ON \
            -DFSMC_ENABLE_BENCHMARKS=OFF

      - name: Build with ASan & UBSan
        run: cmake --build build --parallel 2

      - name: Run Test Suite under ASan + UBSan
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:fast_unwind_on_malloc=0"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: ctest --test-dir build -C Debug --output-on-failure

  sanitizers-tsan:
    name: ThreadSanitizer (TSan) Concurrency Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-tsan

      - name: Configure CMake with TSan (Debug)
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DFSMC_ENABLE_BENCHMARKS=OFF

      - name: Build Concurrency Tests with TSan
        run: |
          cmake --build build --parallel 2 --target \
            test_thread_safe_stress \
            test_spsc_queue \
            test_spsc_fsm \
            test_flight_recorder \
            test_observer \
            test_timed_transitions \
            test_ring_buffer_overflow \
            test_async_and_guards

      - name: Run Concurrency Tests under TSan
        run: |
          ctest --test-dir build -C Debug --output-on-failure --tests-regex "^(test_thread_safe_stress|test_spsc_queue|test_spsc_fsm|test_flight_recorder|test_observer|test_timed_transitions|test_ring_buffer_overflow|test_async_and_guards)$"

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - lint-and-format
      - docs-quality-gate
      - build-and-test
      - sanitizers-asan-ubsan
      - sanitizers-tsan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required CI jobs succeeded
        run: |
          for result in \
            "${{ needs.lint-and-format.result }}" \
            "${{ needs.docs-quality-gate.result }}" \
            "${{ needs.build-and-test.result }}" \
            "${{ needs.sanitizers-asan-ubsan.result }}" \
            "${{ needs.sanitizers-tsan.result }}"; do
            if [ "$result" != "success" ]; then
              echo "CI Gate failed: required job result was '$result'"
              exit 1
            fi
          done
          echo "All required CI jobs succeeded."
