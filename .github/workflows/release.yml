name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v0.6.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release-binaries:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_id: linux-x86_64
          - os: macos-latest
            platform_id: macos-arm64
          - os: windows-latest
            platform_id: windows-x64

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-release

      - name: Configure CMake (Release Mode, Tests Disabled)
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "develop" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          [ -z "$TAG" ] && TAG="v0.6.0"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DFSMC_ENABLE_TESTING=OFF \
            -DFSMC_ENABLE_EXAMPLES=OFF \
            -DFSMC_ENABLE_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX=pkg_dist

      - name: Build Compiler & Tools
        shell: bash
        run: |
          cmake --build build --config Release --parallel 2

      - name: Install to Package Staging Directory
        shell: bash
        run: |
          cmake --install build --config Release --prefix pkg_dist

      - name: Collect Release Tools
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform_id }}" = "windows-x64" ]; then
            EXT=".exe"
          else
            EXT=""
          fi
          cp "pkg_dist/bin/fsmc${EXT}" "dist/fsmc-${RELEASE_TAG}-${{ matrix.platform_id }}${EXT}"
          cp "pkg_dist/bin/fsm-opt${EXT}" "dist/fsm-opt-${RELEASE_TAG}-${{ matrix.platform_id }}${EXT}"

      - name: Upload Release Tools
        uses: actions/upload-artifact@v4
        with:
          name: fsmc-${{ matrix.platform_id }}
          path: dist/*
          retention-days: 1

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging_dist
          merge-multiple: true

      - name: Prepare Release Tools
        shell: bash
        run: |
          mkdir -p release_assets
          cp staging_dist/* release_assets/

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "develop" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          [ -z "$TAG" ] && TAG="v0.6.0"
          VERSION="${TAG#v}"

          python3 - <<EOF
          import re

          version = "${VERSION}"
          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              content = f.read()

          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)

          if match:
              notes = match.group(1).strip()
          else:
              notes = f"Release {version}"

          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          EOF

          echo "Extracted release notes:"
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release_assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
