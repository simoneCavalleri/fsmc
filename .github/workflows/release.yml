name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v0.4.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release-binaries:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_id: linux-x86_64
            archive_ext: tar.gz
          - os: macos-latest
            platform_id: macos-arm64
            archive_ext: tar.gz
          - os: windows-latest
            platform_id: windows-x64
            archive_ext: zip

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-release

      - name: Configure CMake (Release Mode, Tests Disabled)
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "develop" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          [ -z "$TAG" ] && TAG="v0.4.1"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DFSMC_ENABLE_TESTING=OFF \
            -DFSMC_ENABLE_EXAMPLES=OFF \
            -DFSMC_ENABLE_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX=pkg_dist

      - name: Build Compiler & Tools
        shell: bash
        run: |
          cmake --build build --config Release --parallel 2

      - name: Install to Package Staging Directory
        shell: bash
        run: |
          cmake --install build --config Release --prefix pkg_dist

      - name: Create Distribution Archive
        shell: bash
        run: |
          ARCHIVE_NAME="fsmc-${{ env.RELEASE_TAG }}-${{ matrix.platform_id }}.${{ matrix.archive_ext }}"
          mkdir -p dist
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            7z a "dist/${ARCHIVE_NAME}" ./pkg_dist/*
          else
            tar -czf "dist/${ARCHIVE_NAME}" -C pkg_dist .
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsmc-${{ matrix.platform_id }}
          path: dist/*
          retention-days: 1

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging_dist
          merge-multiple: true

      - name: Prepare Standalone Headers & Checksums
        shell: bash
        run: |
          mkdir -p release_assets
          cp staging_dist/* release_assets/ 2>/dev/null || true

          # Copy standalone zero-dependency runtime single headers
          cp include/fsm/backend/cpp/cpp17_standalone_runtime.hpp release_assets/fsmc-cpp17-standalone.hpp
          cp include/fsm/backend/cpp/cpp20_standalone_runtime.hpp release_assets/fsmc-cpp20-standalone.hpp

          # Generate SHA256 checksums
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "develop" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          [ -z "$TAG" ] && TAG="v0.4.1"
          VERSION="${TAG#v}"

          python3 - <<EOF
          import re

          version = "${VERSION}"
          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              content = f.read()

          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)

          if match:
              notes = match.group(1).strip()
          else:
              notes = f"Release {version}"

          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          EOF

          echo "Extracted release notes:"
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release_assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
