name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v0.6.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release-binaries:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_id: linux-x86_64
          - os: macos-latest
            platform_id: macos-arm64
          - os: windows-latest
            platform_id: windows-x64

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        if: runner.os != 'Windows'
        with:
          key: ${{ matrix.os }}-release

      - name: Configure CMake (Release Mode, Tests Disabled)
        shell: bash
        run: |
          CMAKE_VER=$(python3 -c 'import pathlib, re; m = re.search(r"project\s*\(\s*fsmc\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)", pathlib.Path("CMakeLists.txt").read_text()); print(m.group(1) if m else "")')
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "develop" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          [ -z "$TAG" ] && TAG="v${CMAKE_VER}"
          if [ -n "$CMAKE_VER" ] && [ "${TAG#v}" != "$CMAKE_VER" ]; then
            echo "Release tag '$TAG' does not match CMakeLists.txt version '$CMAKE_VER'"
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DFSMC_ENABLE_TESTING=OFF \
            -DFSMC_ENABLE_EXAMPLES=OFF \
            -DFSMC_ENABLE_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX=pkg_dist

      - name: Build Compiler & Tools
        shell: bash
        run: |
          cmake --build build --config Release --parallel 2

      - name: Install to Package Staging Directory
        shell: bash
        run: |
          cmake --install build --config Release --prefix pkg_dist

      - name: Smoke Test Installed Binaries
        shell: bash
        run: |
          if [ "${{ matrix.platform_id }}" = "windows-x64" ]; then
            EXT=".exe"
          else
            EXT=""
          fi
          "./pkg_dist/bin/fsmc${EXT}" --version
          "./pkg_dist/bin/fsm-opt${EXT}" --version
          cat << 'EOF' > smoke.sysml
          state def SmokeFsm {
              entry; then Idle;
              state Idle;
              state Active;
              transition first Idle accept Go then Active;
          }
          EOF
          "./pkg_dist/bin/fsmc${EXT}" -i smoke.sysml -o smoke_fsm.hpp --std=c++20 --standalone
          "./pkg_dist/bin/fsm-opt${EXT}" -i smoke.sysml --verify
          rm -f smoke.sysml smoke_fsm.hpp

      - name: Collect Release Tools & Full SDK Archive
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform_id }}" = "windows-x64" ]; then
            EXT=".exe"
          else
            EXT=""
          fi
          cp "pkg_dist/bin/fsmc${EXT}" "dist/fsmc-${RELEASE_TAG}-${{ matrix.platform_id }}${EXT}"
          cp "pkg_dist/bin/fsm-opt${EXT}" "dist/fsm-opt-${RELEASE_TAG}-${{ matrix.platform_id }}${EXT}"
          SDK_NAME="fsmc-sdk-${RELEASE_TAG}-${{ matrix.platform_id }}"
          if [ "${{ matrix.platform_id }}" = "windows-x64" ]; then
            python3 -c "import shutil; shutil.make_archive('dist/${SDK_NAME}', 'zip', 'pkg_dist')"
          else
            tar -czf "dist/${SDK_NAME}.tar.gz" -C pkg_dist .
          fi

      - name: Upload Release Tools
        uses: actions/upload-artifact@v4
        with:
          name: fsmc-${{ matrix.platform_id }}
          path: dist/*
          retention-days: 1

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging_dist
          merge-multiple: true

      - name: Prepare Release Tools & SHA256 Checksums
        shell: bash
        run: |
          mkdir -p release_assets
          cp staging_dist/* release_assets/
          (cd release_assets && sha256sum * > SHA256SUMS.txt)

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        shell: bash
        run: |
          CMAKE_VER=$(python3 -c 'import pathlib, re; m = re.search(r"project\s*\(\s*fsmc\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)", pathlib.Path("CMakeLists.txt").read_text()); print(m.group(1) if m else "")')
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "develop" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          [ -z "$TAG" ] && TAG="v${CMAKE_VER}"
          VERSION="${TAG#v}"

          python3 - <<EOF
          import re

          version = "${VERSION}"
          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              content = f.read()

          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)

          if match:
              notes = match.group(1).strip()
          else:
              notes = f"Release {version}"

          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          EOF

          echo "Extracted release notes:"
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release_assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
