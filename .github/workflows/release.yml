name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release-binaries:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: fsmc-linux-x86_64
            binary_path: build/bin/fsmc
          - os: macos-latest
            artifact_name: fsmc-macos-arm64
            binary_path: build/bin/fsmc
          - os: windows-latest
            artifact_name: fsmc-windows-x86_64.exe
            binary_path: build/bin/Release/fsmc.exe

    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
        timeout-minutes: 15

      - name: Build Release Binary
        run: |
          cmake --build build --config Release --parallel $([ "$RUNNER_OS" = "Windows" ] && echo 4 || nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4) --verbose
        timeout-minutes: 30

      - name: Package Binary
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact_name }}"
        timeout-minutes: 5

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  create-github-release:
    name: Publish GitHub Release
    needs: build-release-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
