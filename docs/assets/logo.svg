<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- Initial Entry Arrow -->
  <path d="M 60 160 L 170 160" stroke="#0284c7" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>

  <!-- Forward Linear Transitions -->
  <path d="M 255 160 L 345 160" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
  <path d="M 435 160 L 525 160" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>

  <!-- Top Arc Transitions (Forward) -->
  <path d="M 215 115 C 240 40, 360 40, 385 110" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M 395 115 C 420 40, 540 40, 565 110" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>

  <!-- Bottom Arc Transitions (Feedback Loops) -->
  <path d="M 385 205 C 360 280, 240 280, 215 210" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
  <path d="M 565 205 C 540 280, 420 280, 395 210" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>

  <!-- State 1 Node (Atomic State) -->
  <circle cx="215" cy="160" r="45" fill="#0284c7" stroke="#0369a1" stroke-width="8"/>
  <circle cx="215" cy="160" r="20" fill="#38bdf8" opacity="0.3"/>

  <!-- State 2 Node (Intermediate State) -->
  <circle cx="390" cy="160" r="45" fill="#0284c7" stroke="#0369a1" stroke-width="8"/>
  <circle cx="390" cy="160" r="20" fill="#38bdf8" opacity="0.3"/>

  <!-- State 3 Node (Concentric Double-Ring Final State) -->
  <circle cx="610" cy="160" r="52" fill="none" stroke="#0369a1" stroke-width="7"/>
  <circle cx="610" cy="160" r="40" fill="#0284c7" stroke="#0369a1" stroke-width="6"/>
  <circle cx="610" cy="160" r="18" fill="#38bdf8" opacity="0.3"/>
</svg>
