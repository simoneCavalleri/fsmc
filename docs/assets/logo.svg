<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers with vibrant cyan / sky blue -->
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- Initial Entry Arrow -->
  <path d="M 60 160 L 170 160" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-sky)"/>

  <!-- Forward Linear Transitions -->
  <path d="M 255 160 L 345 160" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
  <path d="M 435 160 L 525 160" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>

  <!-- Top Arc Transitions (Forward) -->
  <path d="M 215 115 C 240 35, 360 35, 385 105" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-sky)"/>
  <path d="M 395 115 C 420 35, 540 35, 565 105" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-sky)"/>

  <!-- Bottom Arc Transitions (Feedback Loops) -->
  <path d="M 385 205 C 360 285, 240 285, 215 215" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
  <path d="M 565 205 C 540 285, 420 285, 395 215" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>

  <!-- State 1 Node (Atomic State) -->
  <circle cx="215" cy="160" r="44" fill="#0284c7" stroke="#38bdf8" stroke-width="6"/>
  <circle cx="215" cy="160" r="18" fill="#ffffff" opacity="0.9"/>

  <!-- State 2 Node (Intermediate State) -->
  <circle cx="390" cy="160" r="44" fill="#0284c7" stroke="#38bdf8" stroke-width="6"/>
  <circle cx="390" cy="160" r="18" fill="#ffffff" opacity="0.9"/>

  <!-- State 3 Node (Concentric Double-Ring Final State) -->
  <circle cx="610" cy="160" r="52" fill="none" stroke="#38bdf8" stroke-width="6"/>
  <circle cx="610" cy="160" r="38" fill="#0284c7" stroke="#0ea5e9" stroke-width="5"/>
  <circle cx="610" cy="160" r="16" fill="#ffffff" opacity="0.9"/>
</svg>
