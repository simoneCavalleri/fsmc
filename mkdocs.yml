site_name: fsmc Documentation
site_description: Universal State Machine Compiler, Formal Verification & Zero-Overhead C++ Engine
site_author: Simone Cavalleri
site_url: https://simoneCavalleri.github.io/fsmc/
repo_url: https://github.com/simoneCavalleri/fsmc
repo_name: simoneCavalleri/fsmc
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:

    - scheme: default
      primary: light blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: light blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Getting Started:
      - Installation: getting_started/installation.md
      - Quickstart Tutorial: getting_started/quickstart.md
      - CLI Reference: getting_started/cli_usage.md
  - Architecture & Concepts:
      - States & HFSM Hierarchy: concepts/states_and_hierarchy.md
      - Transitions & Triggers: concepts/transitions_and_events.md
      - Guards & Action Effects: concepts/guards_and_actions.md
      - Memory & Real-Time Guarantees: concepts/memory_and_realtime.md
  - Modeling Languages:
      - OMG SysML v2: formal_languages/sysml_v2.md
      - Cameo / MagicDraw (XMI 2.1): formal_languages/cameo_magicdraw.md
      - W3C SCXML: formal_languages/scxml.md
      - nuXmv / SMV: formal_languages/smv_nuxmv.md
      - Visual Diagrams: formal_languages/diagrams.md
  - Verification & Safety:
      - Model Checking (LTL/CTL): verification_and_safety/model_checking.md
      - EFSM Interval Analysis: verification_and_safety/interval_analysis.md
      - Requirement Traceability (RTM): verification_and_safety/rtm_matrix.md
  - Runtime C++ API:
      - Synchronous Core FSM: runtime_api/synchronous_fsm.md
      - Lock-Free SPSC FSM (ISR-Safe): runtime_api/spsc_fsm.md
      - Thread-Safe MPSC Engine: runtime_api/thread_safe_fsm.md
      - Transition Trace & Telemetry: runtime_api/introspection_trace.md
  - Reference & Tooling:
      - CMake Target Integration: reference/cmake_integration.md
      - Test Suite Catalog: TEST_SUITE_CATALOG.md
      - IR Architecture Specification: ARCHITECTURE.md
  - Interactive Playground: playground/index.md
