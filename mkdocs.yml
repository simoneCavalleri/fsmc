site_name: fsmc Documentation
site_description: Universal State Machine Compiler, Formal Verification & Zero-Overhead C++ Engine
site_author: Simone Cavalleri
site_url: https://simoneCavalleri.github.io/fsmc/
repo_url: https://github.com/simoneCavalleri/fsmc
repo_name: simoneCavalleri/fsmc
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg


  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.path
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow


extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

nav:

  - Overview: index.md
  - Getting Started:
      - getting_started/index.md
      - Installation & Requirements: getting_started/installation.md
      - Quickstart Tutorial: getting_started/quickstart.md
      - CLI Reference (fsmc & fsm-opt): getting_started/cli_usage.md
      - Build Systems Integration: getting_started/integration_guide.md
  - Step-by-Step Tutorials:
      - tutorials/index.md
      - "1. First State Machine": tutorials/01_first_statechart.md
      - "2. EFSM, Guards & Datapath": tutorials/02_guards_and_actions.md
      - "3. Hierarchical HFSM & History": tutorials/03_hierarchical_hfsm.md
      - "4. Formal Verification & Safety": tutorials/04_formal_verification.md
      - "5. Code Generation & Integration": tutorials/05_code_generation_and_integration.md
      - "6. Real-World Project (UAV Controller)": tutorials/06_real_world_case_study.md
  - Architecture & Concepts:
      - concepts/index.md
      - States & HFSM Hierarchy: concepts/states_and_hierarchy.md
      - Transitions & Triggers: concepts/transitions_and_events.md
      - Guards & Action Effects: concepts/guards_and_actions.md
      - Dual-Paradigm Temporal Models: concepts/temporal_models.md
      - Execution Semantics & Metamodel: concepts/execution_semantics.md

  - Modeling Languages:
      - formal_languages/index.md
      - OMG SysML v2: formal_languages/sysml_v2.md
      - Cameo / MagicDraw (XMI 2.1): formal_languages/cameo_magicdraw.md
      - W3C SCXML: formal_languages/scxml.md
      - nuXmv / SMV Formal Logic: formal_languages/smv_nuxmv.md
      - Visual Diagrams: formal_languages/diagrams.md
      - Comprehensive UML Reference: formal_languages/uml_reference.md
  - Verification & Safety:
      - verification_and_safety/index.md
      - Model Checking (LTL/CTL): verification_and_safety/model_checking.md
      - EFSM Interval Analysis: verification_and_safety/interval_analysis.md
      - Requirement Traceability (RTM): verification_and_safety/rtm_matrix.md
  - Runtime C++ API:
      - Overview & Quickstart: runtime_api/index.md
      - Core Building Blocks: runtime_api/core_concepts.md
      - Execution Engines:
          - 1. Synchronous & Control Loops (fsm::fsm): runtime_api/synchronous_fsm.md
          - 2. Lock-Free & ISR (fsm::spsc_fsm): runtime_api/spsc_fsm.md
          - 3. Multi-Threaded Active Object (fsm::thread_safe_fsm): runtime_api/thread_safe_fsm.md
      - Advanced & Real-Time:
          - Memory Layout & WCET: runtime_api/memory_and_realtime.md
          - Tracing & Telemetry: runtime_api/introspection_trace.md
      - Patterns & Reference:
          - Architectural Design Patterns: runtime_api/design_patterns.md
          - Unit Testing Guide: runtime_api/testing_guide.md
          - FAQ & Troubleshooting: runtime_api/faq_and_troubleshooting.md
          - Full API Reference: runtime_api/reference.md

  - Compiler Internals:
      - internals/index.md
      - Compiler Architecture: internals/architecture.md
      - Canonical IR AST Specification: internals/fsm_ir_specification.md

  - Developer & Contributing:
      - contributing/index.md
      - Developer Guide: internals/developer_guide.md
      - Test Suite Catalog: reference/test_suite_catalog.md
      - CMake Target Reference: reference/cmake_integration.md

  - Interactive Playground: playground/index.md



